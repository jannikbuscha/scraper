# Vocabulary policy_domain. Source: docs/CODEBOOK.md §3 (draft of 2026-10-28). See codebook/README.md.
vocabulary: policy_domain
label: "Policy domain"
description: "Proposal (team decision D-7): the divisions of the UN Classification of the Functions of Government (COFOG) as the top level, because it is a citable international standard and makes the results comparable. attributes.cofog holds the COFOG division number. The labels still have to be checked against the official COFOG publication before adoption. Subcodes are proposed from the collected data in Phase 2/3; the team finalises them."
