    examples: null
    sort_order: 10
    active: true
    attributes: {}
  - code: adaptation_of_existing
    label_en: "Adaptation of existing"
    label_uk: null
    definition: "The sources present the initiative as a change, extension or re-purposing of an existing service, platform or organisation. Requires a Relation (`extends`, `builds_on`, `successor_of`) or a rationale explaining why none can be recorded."
