# Vocabulary derived_reason. Source: docs/CODEBOOK.md §3 and §2.7 (draft of 2026-10-28). See codebook/README.md.
vocabulary: derived_reason
label: "Derived value reason"
description: "Reason codes of derived values (fields period_reason and trajectory_reason; docs/CODEBOOK.md §2.7). English labels are derived from the codes."
multi: false
fixed_codes: true
terms:
  - code: no_date
    label_en: "No date"
    label_uk: null
    definition: "No dated launch, beta-launch or archive event."
    include_note: null
    exclude_note: null
    examples: null
    sort_order: 10
    active: true
    attributes: {}
  - code: imprecise_date
    label_en: "Imprecise date"
    label_uk: null
    definition: "The launch interval, taken over all dated launch events or, if there are none, all dated beta-launch events, straddles a cut-off date: it starts before the date and ends on or after it."
    include_note: null
    exclude_note: null
    examples: null
    sort_order: 20
    active: true
    attributes: {}
  - code: archive_bound_only
    label_en: "Archive bound only"
    label_uk: null
    definition: "Only an archive upper bound is known (no dated launch or beta-launch event), and it does not decide the value: it lies on or after `MINISTRY_FOUNDED` (`period_reason`) or on or after `FULL_SCALE_INVASION` (`trajectory_reason`)."
    include_note: null
    exclude_note: null
    examples: null
    sort_order: 30
    active: true
    attributes: {}
  - code: imprecise_modification_date
    label_en: "Imprecise modification date"
    label_uk: null
    definition: "A modification event is undated or straddles `FULL_SCALE_INVASION`."
    include_note: null
    exclude_note: null
    examples: null
    sort_order: 40
    active: true
    attributes: {}
  - code: conflicting_dates
    label_en: "Conflicting dates"
    label_uk: null
    definition: "The launch interval starts on or after `FULL_SCALE_INVASION`, but an archive bound lies before `FULL_SCALE_INVASION`, so the item existed before the invasion."
    include_note: null
    exclude_note: null
    examples: null
    sort_order: 50
    active: true
    attributes: {}
