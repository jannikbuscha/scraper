# Continuous integration: lint, type checks and tests for backend and frontend,
# E2E smoke tests, and a Docker build with a start-up smoke test.
# No deployment and no secrets. All tests run offline against fixtures.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep UV_VERSION in sync with the uv image tag in the Dockerfile.
  UV_VERSION: "0.11.32"
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

defaults:
  run:
    shell: bash

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies (fails if uv.lock is out of date)
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy src
      - name: Pytest
        run: uv run pytest -q

  frontend:
    name: Frontend (ESLint, tsc, Vitest, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests (Vitest)
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: E2E smoke tests (Playwright, Chromium)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Build the frontend and run the E2E tests (make e2e)
        run: make e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14

  docker:
    name: Docker image (build and start-up smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
      - name: Build the image
        run: docker build --build-arg GIT_COMMIT="${GITHUB_SHA}" --tag mdt-portfolio:local .
      - name: Start with docker compose and wait until healthy
        run: docker compose up -d --no-build --wait --wait-timeout 180
      - name: Smoke-test the API and the frontend
        run: |
          curl -fsS http://127.0.0.1:8080/api/health
          echo
          curl -fsS -o "${RUNNER_TEMP}/index.html" http://127.0.0.1:8080/
          grep -qi '<!doctype html' "${RUNNER_TEMP}/index.html"
          # A client-side route gets the app too, and the app's entry script is served.
          curl -fsS -o "${RUNNER_TEMP}/route.html" http://127.0.0.1:8080/projects
          grep -qi '<!doctype html' "${RUNNER_TEMP}/route.html"
          asset="$(grep -o -m 1 '/assets/index-[^"]*\.js' "${RUNNER_TEMP}/index.html")"
          curl -fsS -o /dev/null "http://127.0.0.1:8080${asset}"
      - name: Check that the start left no root-owned files in the checkout
        # The Docker daemon runs as root and creates a missing bind-mount source as root.
        # ./releases is part of the repository and the entrypoint hands ./data to the user
        # "app", so nothing in the checkout may belong to root afterwards.
        run: |
          root_owned="$(find . -xdev -user 0)"
          if [ -n "${root_owned}" ]; then
            echo "::error::Owned by root after docker compose up (see README.md, Data):"
            printf '%s\n' "${root_owned}"
            exit 1
          fi
          stat -c '%u:%g %n' data releases
      - name: Show container logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down
